name: Quality assurance Assets
on:
  workflow_dispatch:
  pull_request:
    branches:
jobs:
  wp-scripts-lint:
    uses: inpsyde/reusable-workflows/.github/workflows/wp-scripts-lint.yml@main
    with:
      STYLELINT_ARGS: '--allow-empty-input'
    secrets:
      NPM_REGISTRY_TOKEN: ${{ secrets.DEPLOYBOT_PACKAGES_READ_ACCESS_TOKEN }}
